services:
  - type: web
    name: geo-kurdistan-demo-api-amanj
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: geo-kurdistan-demo-api
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: info
      - key: DEPLOYMENT_PROFILE
        value: demo
      - key: DATABASE_URL
        fromDatabase:
          name: geo-kurdistan-demo-db-amanj
          property: connectionString
      - key: DATABASE_SSL
        value: false
      - key: DATABASE_POOL_SIZE
        value: 3
      - key: DATABASE_CONNECT_TIMEOUT_MS
        value: 10000
      - key: TRUST_PROXY
        value: true
      - key: CORS_ORIGINS
        value: https://geo-kurdistan-demo-web-amanj.onrender.com
      - key: REQUEST_BODY_LIMIT_BYTES
        value: 1048576
      - key: RATE_LIMIT_MAX
        value: 90
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: SWAGGER_ENABLED
        value: false
      - key: HEALTH_DB_TIMEOUT_MS
        value: 5000
      - key: QUEUE_SCHEMA
        value: pgboss
      - key: QUEUE_CONCURRENCY
        value: 1
      - key: JOB_PROOF_TIMEOUT_MS
        value: 15000
      - key: AUTH_FIREBASE_PROJECT_ID
        sync: false
      - key: AUTH_FIREBASE_SERVICE_ACCOUNT_PATH
        value: /etc/secrets/firebase-service-account.json
      - key: AUTH_SESSION_COOKIE_NAME
        value: gk_session
      - key: AUTH_CSRF_COOKIE_NAME
        value: gk_csrf
      - key: AUTH_PREAUTH_CSRF_COOKIE_NAME
        value: gk_preauth_csrf
      - key: AUTH_SESSION_TTL_SECONDS
        value: 86400
      - key: AUTH_REAUTH_MAX_AGE_SECONDS
        value: 300
      - key: AUTH_INVITATION_TTL_HOURS
        value: 168
      - key: AUTH_COOKIE_SECURE
        value: true
      - key: AUTH_COOKIE_DOMAIN
        value: ""
      - key: AUTH_PRIVILEGED_MFA_REQUIRED
        value: false
      - key: MEDIA_STORAGE_ENDPOINT
        sync: false
      - key: MEDIA_STORAGE_REGION
        sync: false
      - key: MEDIA_STORAGE_BUCKET
        sync: false
      - key: MEDIA_STORAGE_KEY_ID
        sync: false
      - key: MEDIA_STORAGE_APPLICATION_KEY
        sync: false
      - key: MEDIA_DEMO_IMAGE_PROCESSING_ENABLED
        value: true
      - key: MEDIA_DEMO_STORAGE_PREFIX
        value: demo-7day
      - key: MEDIA_DEMO_MAX_IMAGE_BYTES
        value: 3145728
      - key: MEDIA_DEMO_MAX_IMAGE_PIXELS
        value: 12000000

  - type: web
    name: geo-kurdistan-demo-web-amanj
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    autoDeployTrigger: off
    envVars:
      - key: PORT
        value: 10000
      - key: API_INTERNAL_BASE_URL
        value: https://geo-kurdistan-demo-api-amanj.onrender.com
      - key: NEXT_PUBLIC_CSRF_COOKIE_NAME
        value: gk_csrf
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: NEXT_PUBLIC_MEDIA_DEMO_IMAGES_ONLY
        value: true

databases:
  - name: geo-kurdistan-demo-db-amanj
    plan: free
    region: frankfurt
    databaseName: geo_kurdistan_demo
    user: geo_kurdistan_demo
